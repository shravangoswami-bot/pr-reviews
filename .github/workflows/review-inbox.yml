name: Review requests
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      comment_url:
        description: Optional request comment URL
        type: string
      retry:
        description: Resume a failed request
        type: boolean
        default: false
      check_subscription:
        description: Check Claude subscription and model
        type: boolean
        default: false
      check_cloud:
        description: Check cloud access without starting a review
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  review:
    cache-mode: write
    if: >-
      vars.REVIARY_ENABLED == 'true' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request &&
        github.event.issue.number == fromJSON(vars.REVIARY_CONFIG).inbox.issue &&
        contains(fromJSON(vars.REVIARY_CONFIG).requesters.*.id, github.event.comment.user.id)))
    uses: shravanngoswamii/reviary/.github/workflows/review-bot.yml@aebf9f1cf4967e75619b4ce1c8a439b887602c4c
    with:
      tool_repository: shravanngoswamii/reviary
      tool_ref: aebf9f1cf4967e75619b4ce1c8a439b887602c4c
      config_json: ${{ vars.REVIARY_CONFIG }}
      comment_url: ${{ inputs.comment_url || '' }}
      retry: ${{ inputs.retry || false }}
      check_subscription: ${{ inputs.check_subscription || false }}
      check_cloud: ${{ inputs.check_cloud || false }}
    secrets:
      REVIEW_BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_REFRESH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_REFRESH_TOKEN }}
      CLAUDE_CLOUD_TRIGGERS: ${{ secrets.CLAUDE_CLOUD_TRIGGERS }}
